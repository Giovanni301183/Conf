<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventivatore Tracker</title>
<style>
:root{
  --bg:#f4f2ed; --card:#ffffff; --ink:#1f2b33; --ink2:#3b4852; --muted:#76818a; --line:#e6e2d9; --soft:#f8f6f2; --soft2:#efece5;
  --acc:#235e5a; --acc2:#2f7a74; --acc-soft:#e4efed; --gold:#b9843f;
  --warn:#9a5b12; --bad:#a23b32;
  --c-mat:#3e6b8a; --c-zinc:#9aa6ac; --c-lav:#c58a42; --c-acq:#5f9473; --c-altro:#8b72a3;
  --r:14px; --sh:0 1px 2px rgba(31,43,51,.04),0 4px 16px rgba(31,43,51,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--ink);color:#fff}
.top{display:flex;align-items:center;gap:24px;padding:14px 28px;flex-wrap:wrap;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-items:center;flex:none}
.brand h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;color:#9fb0b8;font-size:11.5px;font-weight:400}
.kpis{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:center}
.kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 14px}
.kpi small{display:block;color:#9fb0b8;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi.main{background:var(--acc2);border-color:var(--acc2)}.kpi.main small{color:#cfe6e2}.kpi.main b{font-size:17px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
header .btn{background:transparent;color:#dbe3e6;border-color:rgba(255,255,255,.18)}
header .btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3)}
header .btn.p{background:var(--gold);border-color:var(--gold);color:#fff}
header .btn.p:hover{background:#c99550}
.navbar{background:rgba(244,242,237,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
nav{display:flex;gap:2px;padding:6px 28px 0;overflow-x:auto;scrollbar-width:none;max-width:1560px;margin:0 auto}
nav button{border:0;background:none;padding:10px 11px 12px;font:inherit;font-weight:550;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--soft2);font-size:11px;font-weight:600;color:var(--muted)}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav button.on i{background:var(--acc);color:#fff}
nav .navtot{margin-left:auto;align-self:center;font-size:13px;color:var(--muted);white-space:nowrap;padding-left:16px}
nav .navtot b{color:var(--acc);font-size:14px}
main{padding:28px;max-width:1560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:20px;box-shadow:var(--sh)}
.card h2{font-size:15.5px;font-weight:650;margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink)}
.card h2 .sp{flex:1}
.card h3{font-size:11.5px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0 0 16px;max-width:920px}
code{background:var(--soft2);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 20px}
.cols2{display:grid;grid-template-columns:3fr 2fr;gap:20px}
.cols2>.card{margin-bottom:20px}
@media (max-width:1000px){.cols2{grid-template-columns:1fr}}
label.f,div.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.stat{font-size:20px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;padding-top:3px}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover{border-color:#d3cec2}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc2);box-shadow:0 0 0 3px var(--acc-soft)}
td input,td select{width:100%;padding:4px 7px;border-color:transparent;background:transparent;border-radius:6px}
td input:hover,td select:hover{border-color:var(--line);background:#fff}
td input:focus,td select:focus{background:#fff}
input.n{text-align:right;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:8px;padding:7px 13px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{border-color:var(--acc2);color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:var(--acc2);color:#fff}
.btn.s{padding:3px 10px;font-size:12px}
.btn.x{border:0;color:#b5b0a6;padding:2px 7px;background:none;font-size:13px}.btn.x:hover{color:var(--bad)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid #f0ede6;text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--soft);white-space:nowrap;border-bottom:1px solid var(--line)}
tr:hover td{background-color:#fcfbf8}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.calc{color:var(--ink2);background:var(--soft)}
tr.tot td{font-weight:650;background:var(--soft2)!important;border-top:1px solid #d9d4c8}
.seg{display:inline-flex;background:var(--soft2);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;border-radius:6px;color:var(--ink2)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--acc);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(31,43,51,.18)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px;background:var(--soft2);color:var(--muted)}
.code{font-family:Consolas,"Courier New",monospace;font-size:11.5px;color:var(--muted)}
.warn{background:#fbf3e4;border:1px solid #ecd6ad;color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:18px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft2);margin:14px 0;gap:2px}
.bar div{height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.legend span{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted)}
.legend span b{display:block;font-size:16px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tree td:first-child{white-space:nowrap}
.tree tr.d0 td{font-weight:650;background:var(--soft)}
.tree tr.d1 td{font-weight:550}
.tree tr.d1 td:first-child{padding-left:30px}
.tree tr.d2 td:first-child{padding-left:52px}
.tree tr.d3 td:first-child{padding-left:74px}
.tree tr.sd td{color:var(--muted);font-size:12.5px}
.tree tr.sd td:first-child{padding-left:96px}
.tg{display:inline-block;width:20px;cursor:pointer;color:var(--acc);user-select:none;font-size:11px}
.tree .lbl{white-space:normal;display:inline}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--cc,var(--muted))}
.cat-STRUTTURA{--cc:var(--c-mat)} .cat-ELETTROMECCANICO{--cc:var(--c-lav)} .cat-ELETTRONICO{--cc:var(--c-altro)} .cat-BULLONERIA{--cc:var(--c-zinc)} .cat-VOCI{--cc:var(--gold)}
.card.cat{border-top:3px solid var(--cc)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 4px;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:12.5px;color:var(--ink2)}
.toolbar input{width:80px;padding:4px 7px}
.sdbox{background:var(--soft)!important;padding:12px 14px}
.sdbox table{background:#fff;border-radius:8px}
.muted{color:var(--muted)}
.right{text-align:right}
.hide{display:none}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--soft);border-radius:10px}
.rid{display:inline-grid;place-items:center;min-width:30px;height:22px;border-radius:6px;background:var(--acc-soft);color:var(--acc);font-weight:650;font-size:12px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:10px 0 18px}
.meta div{font-size:12px;color:var(--muted)} .meta b{display:block;color:var(--ink);font-size:14px;font-weight:600}
@media (max-width:700px){.top,nav,main{padding-left:16px;padding-right:16px}.kpis{justify-content:flex-start}.card{padding:18px 16px}}
@media print{
  .navbar,.actions,.noprint,.btn,.tg{display:none!important}
  header{background:#fff;color:var(--ink)}
  .kpi{background:var(--soft);border-color:var(--line)} .kpi small,.brand small{color:var(--muted)}
  body{background:#fff;font-size:11px}
  main{padding:0}
  .card{box-shadow:none;border:0;padding:0;margin-bottom:14px;break-inside:avoid}
}
label.f.imp{background:var(--soft);border-radius:10px;padding:10px 12px;gap:8px}
label.f.imp span{display:flex;flex-direction:column;color:var(--ink2);font-weight:550;min-height:36px}
label.f.imp em{font-style:normal;color:var(--muted);font-weight:400;font-size:11.5px}
.grid.imps{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
td select{min-width:84px}
table.rows td,table.rows th{padding:7px 8px}
table.rows .seg button{padding:4px 8px}
table.rows td select{min-width:76px}
.card h2 input,.card h2 select{font-size:13px;font-weight:400}
.card h2 select{padding:6px 8px}

/* ---- Frecce di aumento / diminuzione sui campi numerici ---- */
.stp{position:relative;display:block}
.stp.w{display:inline-block}
.toolbar .stp{display:inline-block;width:92px}
.stp input,.toolbar .stp input{width:100%;padding-right:22px}
.spin{position:absolute;right:3px;top:3px;bottom:3px;width:16px;display:flex;flex-direction:column;gap:1px;opacity:0;transition:opacity .12s}
.stp:hover .spin,.stp:focus-within .spin{opacity:1}
@media (hover:none){.spin{opacity:1}}
.spin button{flex:1;border:0;padding:0;border-radius:4px;background:var(--soft2);color:var(--muted);cursor:pointer;display:grid;place-items:center;touch-action:none}
.spin button:hover{background:var(--acc);color:#fff}
.spin svg{width:9px;height:9px;pointer-events:none}
@media print{.spin{display:none}}
/* ---- Distinta lavorazione ---- */
table.dl tr.g1 td{background:var(--acc-soft);color:var(--acc);font-weight:650}
table.dl tr.g2 td{background:var(--soft);font-weight:600;font-size:12px;color:var(--ink2);letter-spacing:.03em}
table.dl tr.sd td{color:var(--muted);font-size:12px}
table.dl td.c{text-align:center}

/* ---- Gantt di produzione ---- */
.onlyprint{display:none}
table.gt th,table.gt td{padding:5px 8px;white-space:nowrap}
table.gt th.tl,table.gt td.tl{padding:0;position:relative;width:55%;min-width:480px}
table.gt td.tl{height:32px;background-image:linear-gradient(to right,transparent 71.43%,rgba(31,43,51,.045) 71.43%),linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--nw)) 100%}
table.gt tr.g1 td{background-color:var(--acc-soft);color:var(--acc);font-weight:650}
table.gt tr.end td{font-weight:650;background-color:var(--soft2);border-top:1px solid #d9d4c8}
table.gt td.dur{width:92px}
table.gt td.np input{padding:3px 6px;font-size:12.5px}
table.gt input.ovr{font-weight:700;color:var(--gold)}
table.gt td.dt{white-space:nowrap}
table.gt td.dt input{padding:3px 4px;font-size:12px;width:122px}
table.gt td.np .btn{padding:2px 8px;font-size:13px}
table.gt td.np{white-space:nowrap}
table.gt td.np .btn.x{opacity:.35}
table.gt tr:hover td.np .btn.x{opacity:1}
table.gt td.gname .noprint input{display:inline-block;width:auto;min-width:200px;padding:3px 6px;font-size:12.5px}
.gb,.gm{cursor:grab;z-index:2;touch-action:none}
.gb.drag,.gm.drag{cursor:grabbing;opacity:.75;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.gh{position:absolute;right:-3px;top:-2px;bottom:-2px;width:9px;cursor:ew-resize}
.gtoday{pointer-events:none}
.tlh{position:relative;height:38px}
.tlh div{position:relative;height:19px}
.tlh span{position:absolute;top:0;padding-left:4px;border-left:1px solid var(--line);font-size:10px;line-height:19px;white-space:nowrap;overflow:hidden;text-transform:none;letter-spacing:0;font-weight:500}
.tlh div:first-child span{font-weight:650;color:var(--ink2)}
.gb{position:absolute;top:8px;bottom:8px;min-width:3px;border-radius:4px;background:var(--cc)}
.gs{position:absolute;top:13px;height:6px;border-radius:3px;background:var(--acc);opacity:.5}
.gm{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;transform:rotate(45deg);background:var(--cc)}
.gtoday{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);opacity:.55;z-index:1}
.glegend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 12px}
.glegend i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:6px}
.glegend i.lt{width:0;height:12px;border-left:2px solid var(--bad);vertical-align:-1px}
.gtitle{font-size:12px;margin-bottom:8px}
/* ---- Computo montaggio ---- */
table.mc td.desc{white-space:normal;min-width:280px;font-size:12.5px;line-height:1.4}
table.mc td.in{width:104px}
table.mc td:first-child{white-space:nowrap}
table.mc tr.zero td{color:var(--muted)}
table.mc tr.miss td:first-child{box-shadow:inset 3px 0 var(--gold)}
@media print{table.mc td.in{text-align:right}table.mc td,table.mc th{font-size:10px;padding:3px 6px}}
@media print{
  .onlyprint{display:revert!important}
  .fb{animation:none!important}
  .pcard{break-inside:auto!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.gt .np{display:none}
  table.gt tr{break-inside:avoid}
  table.gt th,table.gt td{padding:3px 6px;font-size:10px}
  table.gt td.tl{height:22px}
  table.gt th.tl,table.gt td.tl{min-width:0;width:50%}
  .gb{top:5px;bottom:5px}.gs{top:8px}
  body.pg header,body.pg main>*:not(.pon),body.pg .pcard .fh{display:none!important}
  body.pg .pon~.pon{break-before:page}
}

/* ---- Tendine ---- */
.tabtools{display:flex;justify-content:flex-end;gap:6px;margin:-8px 0 12px}
.card.fold{padding:0;overflow:hidden;transition:box-shadow .2s}
.card.fold:hover{box-shadow:0 1px 2px rgba(31,43,51,.05),0 8px 24px rgba(31,43,51,.07)}
.fh{display:flex;align-items:center;gap:16px;padding:18px 24px;cursor:pointer;user-select:none;min-height:72px}
.fh:hover .chev{background:var(--acc-soft)}
.fold.open .fh{border-bottom:1px solid var(--line);background:linear-gradient(var(--soft),#fff)}
.fh h2{margin:0!important}
.ft{min-width:0}
.fsum{color:var(--muted);font-size:13px;margin-top:3px;display:flex;align-items:center;gap:0;flex-wrap:wrap}
.fsum b{color:var(--ink);font-weight:600;margin-right:4px}
.fact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;cursor:default}
.fact select{font-size:13px;padding:6px 8px}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft2);color:var(--acc);display:grid;place-items:center;transition:transform .25s ease,background .2s}
.fold.open>.fh .chev,.sfold.open>.sfh .chev{transform:rotate(90deg);background:var(--acc);color:#fff}
.step{flex:none;width:32px;height:32px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:14px}
.fold.open .step{background:var(--acc);color:#fff}
.fb{padding:20px 24px 24px;animation:fin .2s ease}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.card.fold.cat{border-top:3px solid var(--cc)}
.sfold{border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.sfh{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none;background:var(--soft)}
.sfh:hover{background:var(--soft2)}
.sfh .chev{width:24px;height:24px}
.sfh .fsum{margin:0 0 0 auto}
.sfb{padding:12px}
.minibar{display:inline-flex;width:160px;height:8px;border-radius:4px;overflow:hidden;gap:1px;margin-right:12px;background:var(--soft2)}
.minibar i{display:block;height:100%}
.card.head{padding:18px 24px}
.headrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.headrow h2{margin:0 0 2px}
.tree tr.click{cursor:pointer}
.tree tr.click:hover td{background:var(--acc-soft)!important}
@media print{.chev,.tabtools{display:none!important}.fh{padding:8px 0;min-height:0}.fb{padding:8px 0}}
.fh .sp,.headrow .sp{flex:1}

/* ---- Archivio ---- */
.curname{margin-right:18px;color:var(--ink2);font-weight:600}
.curname i{font-style:normal;font-weight:500;font-size:12px;margin-left:6px;color:var(--gold)}
.curname i.ok{color:var(--c-acq)}
table.arch td{padding:12px 14px}
table.arch th{padding:10px 14px}
table.arch tr.cur td{background:var(--acc-soft)}
table.arch .acts{white-space:nowrap;text-align:right}
table.arch .acts .btn{margin-left:4px}
.small{font-size:12px}
.tag.on{background:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:all .25s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-4 9 4-9 4z"/><path d="M12 14v7M8 21h8"/></svg></div>
      <h1>Preventivatore Tracker<small>Configuratore costi · tracker 1303</small></h1></div>
    <div class="kpis" id="kpis"></div>
    <div class="actions">
      <button class="btn" data-act="newPrev">Nuovo</button>
      <button class="btn" data-act="tab" data-val="archivio">Preventivi</button>
      <button class="btn" data-act="archSave" title="Salva nell'archivio (Ctrl+S)">Salva</button>
      <button class="btn p" data-act="print">Stampa / PDF</button>
    </div>
  </div>
</header>
<div class="navbar"><nav id="nav"></nav></div>
<main id="main"></main>
<input type="file" id="file" accept=".json,application/json" class="hide">

// Pianificazione della commessa: data di avvio, durate scritte a mano e date "non prima del" per fase (vuoto = calcolato).
function defGantt(){return {inizio:'',dur:{},da:{}};}
// Marginalita': % generale + % per categoria (vuota = usa la generale). modo: 'margine' sul prezzo | 'ricarico' sul costo.
const MCATS=[...CATS,'VOCI EXTRA'];
function defMarg(){return {modo:'margine',gen:0,cat:Object.fromEntries(MCATS.map(c=>[c,'']))};}
function normPrev(p){if(p&&!p.marg)p.marg=defMarg();if(p&&!p.gantt)p.gantt=defGantt();if(p&&!p.mont)p.mont=defMontPrev();return p;}
function margPct(prev,cat){const M=prev.marg||defMarg(),v=M.cat&&M.cat[cat];return v===''||v==null?num(M.gen):num(v);}
// Fattore prezzo/costo. Margine sul prezzo: P = C / (1 - m). Ricarico sul costo: P = C * (1 + r).
function margFactor(prev,cat){const p=margPct(prev,cat)/100;
  if((prev.marg||{}).modo==='ricarico')return p>-1?1+p:null;
  return p<1?1/(1-p):null;}

/* ======================= CALCOLO ======================= */
function evalQ(expr,drv){
  let tot=0;
  for(const term of String(expr??'').split('+')){
    const t=term.trim(); if(!t)continue;
    let k=1;
    for(const f of t.split('*')){const x=f.trim().toUpperCase(); k*= (x in drv)?drv[x]:num(x);}
    tot+=k;
  }
  return tot;
}
function unitCost(it){return it.sd&&it.sd.length? it.sd.reduce((s,r)=>s+num(r.q)*num(r.p),0) : num(it.costo);}
function costLine(it,q,L,mz){
  const r={peso:0,mat:0,zinc:0,lav:0,acq:0,altro:0};
  if(!it)return r;
  if(it.t==='barra'||it.t==='pezzo'){
    // Materiale e lavorazione sul peso nero; zincatura sul peso zincato (nero + maggiorazione).
    // Il peso mostrato e' quello zincato solo per i pezzi che si zincano, altrimenti il nero.
    const kgT=q*(it.t==='barra'?num(L):1)*num(it.kg), kgZ=kgT*(1+mz), zn=num(it.zn);
    r.peso=zn>0?kgZ:kgT; r.mat=kgT*num(it.acq); r.zinc=kgZ*zn; r.lav=kgT*num(it.lav);
  } else { r.peso=q*num(it.kg); r.acq=q*unitCost(it); }
  return r;
}
const tot=o=>o.mat+o.zinc+o.lav+o.acq+o.altro;
const fL=L=>num(L).toLocaleString('it-IT',{maximumFractionDigits:3,useGrouping:'always'});
function rigaLabel(r,i){return `R${i+1} · ${r.taglia} mod · ${r.tipo} · ×${num(r.n)}`;}

function compute(data,prev){
  const mz=num(data.params.maggZinc);
  const map=new Map(data.listino.map(x=>[x.c,x]));
  const lines=[], warn=new Set();
  const wp=num(prev.modulo.wp);
  let nTracker=0, nModuli=0;
  const righe=prev.righe.map((r,i)=>{
    const sz=data.sizes[r.taglia]; const n=num(r.n);
    const out={i,label:rigaLabel(r,i),n,moduli:0,tot:0};
    if(!sz){warn.add(`Taglia ${r.taglia} non definita`);return out;}
    out.moduli=num(r.taglia)*n; nTracker+=n; nModuli+=out.moduli;
    const drv={MOT:num(sz.mot),CUSC:num(sz.cusc),OMEGA:num(sz.omega),PANN:num(r.taglia)};
    const res={'$PROF':r.prof,'$ASSE':r.asse==='3,0'?'ASSE 120x120x3':'ASSE 120x120x2,5','$OMEGA':'OMEGA '+r.omega};
    const resL={'$LFOND':num(r.lFond),'$LCUSC':num(r.lCusc),'$LMOT':Math.round((num(r.lCusc)-0.08)*100)/100};
    const rows=[...data.template, ...sz.assi.map(a=>({g:'ASSI DI ROTAZIONE',c:a.c,d:a.d,L:a.L,qa:a.q,qb:''}))];
    for(const t of rows){
      const expr=(r.tipo==='Basso'&&String(t.qb??'').trim()!=='')?t.qb:t.qa;
      const q1=evalQ(expr,drv); if(!q1)continue;
      const code=res[t.c]??t.c; const L=(typeof t.L==='string'&&t.L.startsWith('$'))?resL[t.L]:t.L;
      const it=map.get(code);
      if(!it)warn.add(`Codice "${code}" non trovato nel listino (${t.g})`);
      const c=costLine(it,q1*n,L,mz);
      const base=t.d||(it?it.d:code);
      lines.push({riga:i,rigaLabel:out.label,gruppo:t.g,cat:it?it.cat:'NON TROVATO',sub:it?it.sub:'',code,
        desc:base+(num(L)&&it&&it.t==='barra'?` · L ${fL(L)} m`:''),L:it&&it.t==='barra'?num(L):'',q:q1*n,qPer:q1,sd:it&&it.sd,...c});
    }
    return out;
  });
  for(const [k,code,g] of IMP){
    const q=num(prev.imp[k]); if(!q)continue;
    const it=map.get(code); if(!it){warn.add(`Codice "${code}" non trovato nel listino`);continue;}
    lines.push({riga:'imp',rigaLabel:'IMPIANTO (indipendente dal n. tracker)',gruppo:g,cat:it.cat,sub:it.sub,code,desc:it.d,L:'',q,qPer:q,sd:it.sd,...costLine(it,q,0,mz)});
  }
  const kwp=nModuli*wp/1000;
  const base=lines.reduce((s,l)=>s+tot(l),0);
  for(const e of prev.extra){
    const v=num(e.val); let imp=0,q=1;
    if(e.modo==='tracker'){imp=v*nTracker;q=nTracker;} else if(e.modo==='kwp'){imp=v*kwp;q=kwp;} else if(e.modo==='perc'){imp=base*v/100;} else imp=v;
    const c={peso:0,mat:0,zinc:0,lav:0,acq:0,altro:0}; c[e.voce||'altro']=imp; e._imp=imp;
    lines.push({riga:'extra',rigaLabel:'VOCI EXTRA',gruppo:'VOCI EXTRA',cat:'VOCI EXTRA',sub:EXTRA_VOCI.find(x=>x[0]===(e.voce||'altro'))[1],code:'',desc:e.desc||'(senza descrizione)',L:'',q,qPer:q,...c});
  }
  const T={peso:0,mat:0,zinc:0,lav:0,acq:0,altro:0};
  for(const l of lines){for(const k in T)T[k]+=l[k]; if(typeof l.riga==='number')righe[l.riga].tot+=tot(l);}
  const steel=lines.filter(l=>l.cat==='STRUTTURA').reduce((s,l)=>s+l.peso,0);
  const totTracker=righe.reduce((s,r)=>s+r.tot,0);
  let prezzo=0; righe.forEach(r=>r.prezzo=0);
  for(const l of lines){let f=margFactor(prev,l.cat);
    if(f==null){warn.add(`Margine di "${l.cat}" non valido: con il margine sul prezzo deve essere sotto il 100 %`);f=1;}
    l.prezzo=tot(l)*f; prezzo+=l.prezzo; if(typeof l.riga==='number')righe[l.riga].prezzo+=l.prezzo;}
  return {lines,righe,T,total:tot(T),prezzo,kwp,wp,nTracker,nModuli,steel,totTracker,warn:[...warn]};
}

/* ======================= ALBERO DI ESPLOSIONE ======================= */
const zero=()=>({peso:0,mat:0,zinc:0,lav:0,acq:0,altro:0,q:0});
function addTo(n,l){for(const k of ['peso','mat','zinc','lav','acq','altro'])n[k]+=l[k];}
function buildTree(lines,levels){
  const root={children:new Map(),...zero()};
  for(const l of lines){
    let node=root; addTo(node,l);
    levels.forEach((lv,i)=>{
      const {key,label,sub}=lv(l);
      let ch=node.children.get(key);
      if(!ch){ch={key,label,sub,children:new Map(),...zero()};node.children.set(key,ch);}
      node=ch; addTo(node,l);
      if(i===levels.length-1){node.q+=l.q;node.leaf=true;if(l.sd){node.sd=l.sd;}}
    });
  }
  return root;
}
const leafLv=l=>({key:l.code+'|'+l.L+'|'+l.desc,label:l.desc,sub:l.code});
const VIEWS={
  cat:{name:'Per categoria',levels:[
    l=>({key:l.cat,label:l.cat}),
    l=>({key:l.sub||'-',label:l.sub||'-'}),
    leafLv],
    order:k=>{const i=[...CATS,'VOCI EXTRA'].indexOf(k);return i<0?99:i;}},
  grp:{name:'Per gruppo di assieme',levels:[
    l=>({key:String(l.riga),label:l.rigaLabel}),
    l=>({key:l.gruppo,label:l.gruppo}),
    leafLv],order:()=>0},
  voce:{name:'Per voce di costo',levels:null},
};

/* ======================= UTILITY UI ======================= */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fN=(n,d=2)=>(+n||0).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});
const eur=n=>fN(n)+' €';
const fQ=q=>fN(q,Number.isInteger(Math.round(q*1000)/1000)?0:2);
const fDate=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?`${m[3]}/${m[2]}/${m[1]}`:(d||'–');};
const pct=(a,b)=>b?fN(a/b*100,1)+' %':'–';
const vN=v=>v===''||v==null?'':String(v).replace('.',',');
function getP(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],S);}
function setP(p,v){const ks=p.split('.');const last=ks.pop();ks.reduce((o,k)=>o[k],S)[last]=v;}
function inp(path,{type='num',cls='',ph='',w=''}={}){
  const v=getP(path);
  const isN=type==='num'||type==='optnum'||type==='pct';
  const shown=type==='pct'?vN(Math.round(num(v)*1e6)/1e4):isN||(type==='lexpr'&&typeof v==='number')?vN(v):(v??'');
  // Frecce su ogni campo numerico (non sui segnaposto $LFOND ecc. delle distinte).
  const spin=isN||(type==='lexpr'&&!(typeof v==='string'&&v.startsWith('$')));
  const el=`<input class="${isN?'n ':''}${cls}" data-bind="${path}" data-type="${type}" value="${esc(shown)}" placeholder="${esc(ph)}" ${isN?'inputmode="decimal"':''} ${spin?`data-step="${stepFor(path)}"`:''} ${w&&!spin?`style="width:${w}"`:''}>`;
  return spin?`<span class="stp${w?' w':''}" ${w?`style="width:${w}"`:''}>${el}<span class="spin"><button type="button" tabindex="-1" data-bump="1" title="Aumenta (Maiusc = ×10)">${ARR_UP}</button><button type="button" tabindex="-1" data-bump="-1" title="Diminuisci (Maiusc = ×10)">${ARR_DN}</button></span></span>`:el;
}
const ARR_UP='<svg viewBox="0 0 10 10"><path d="M2 6.5L5 3.5L8 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARR_DN='<svg viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// Passo delle frecce secondo il campo: pezzi a 1, €/kg al centesimo, lunghezze a 5 cm, ecc.
function stepFor(path){
  if(/^data\.params\.gantt\.kg/.test(path))return 500;
  if(/\.(n|mot|cusc|omega)$|^prev\.imp\.|\.sd\.\d+\.q$/.test(path))return 1;
  if(path==='prev.modulo.wp')return 5;
  if(/\.(acq|zn|lav|kg)$/.test(path))return 0.01;
  if(/\.(costo|p)$/.test(path))return 1;
  if(/\.L$/.test(path))return 0.05;
  if(/^prev\.marg\./.test(path))return 0.5;
  if(path==='data.params.maggZinc')return 0.1;
  if(/^prev\.extra\.\d+\.val$/.test(path))return getP(path.replace(/val$/,'modo'))==='perc'?0.5:10;
  return 1;
}
const decs=x=>Math.min(6,(String(x).split('.')[1]||'').length);
function bump(path,type,step,dir){
  const v=getP(path);
  // Campo opzionale vuoto: le frecce partono dal valore calcolato (margine generale, durata del Gantt, quantita' o prezzo di listino).
  const cur=type==='pct'?num(v)*100:(v===''||v==null)&&type==='optnum'?(path in AUTO?num(AUTO[path]):path.startsWith('prev.marg.')?num(S.prev.marg.gen):0):num(v);
  const d=Math.max(decs(step),decs(Math.round(cur*1e6)/1e6));
  const nv=Math.max(0,Math.round((cur+dir*step)*10**d)/10**d);
  setP(path,type==='pct'?Math.round(nv*1e6)/1e8:nv);
  const m=path.match(/^prev\.righe\.(\d+)/); if(m)fixRiga(S.prev.righe[+m[1]]);
  save();
}
function sel(path,opts,type='txt'){
  const v=String(getP(path));
  return `<select data-bind="${path}" data-type="${type}">${opts.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===v?'selected':''}>${esc(lab)}</option>`;}).join('')}</select>`;
}
function seg(path,opts){
  const v=String(getP(path));
  return `<span class="seg">${opts.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<button data-act="set" data-path="${path}" data-val="${esc(val)}" class="${String(val)===v?'on':''}">${esc(lab)}</button>`;}).join('')}</span>`;
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ======================= RENDER ======================= */
const TABS=[['archivio','Preventivi'],['listino','Listino'],['distinte','Distinte base'],['config','Configura'],['costi','Costi'],['extra','Voci extra'],['margini','Margini'],['lavor','Distinta lavorazione'],['mont','Montaggio']];
let R=null, FOLD_IDS=[], tabFocus=false;
const CHEV='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
// Una tendina resta aperta finche' l'utente non la chiude: nessuna azione la chiude da sola.
function isOpen(id){return !!S.ui.folds[id];}
// Tendina: chiusa mostra solo titolo + riepilogo in una riga; il contenuto si genera solo quando e' aperta.
function fold(id,{title,sum='',act='',body,cls='',step=''}){
  FOLD_IDS.push(id); const o=isOpen(id);
  return `<section class="card fold ${o?'open':''} ${cls}" data-fold="${id}"><div class="fh" data-act="fold" data-val="${id}">
    ${step?`<span class="step">${step}</span>`:''}<div class="ft"><h2>${title}</h2>${sum?`<div class="fsum">${sum}</div>`:''}</div>
    <span class="sp"></span>${o&&act?`<div class="fact">${act}</div>`:''}<span class="chev">${CHEV}</span></div>
    ${o?`<div class="fb">${body()}</div>`:''}</section>`;
}
function subfold(id,title,sum,body){
  FOLD_IDS.push(id); const o=isOpen(id);
  return `<div class="sfold ${o?'open':''}"><div class="sfh" data-act="fold" data-val="${id}"><span class="chev">${CHEV}</span><b>${title}</b><span class="fsum">${sum}</span></div>${o?`<div class="sfb">${body()}</div>`:''}</div>`;
}
const tabTools=()=>`<div class="tabtools noprint"><button class="btn s" data-act="foldAll" data-val="1">Apri tutte</button><button class="btn s" data-act="foldAll" data-val="0">Chiudi tutte</button></div>`;
function miniBar(T,total){return `<span class="minibar">${COLS.map(([k,,c])=>T[k]?`<i style="width:${T[k]/total*100}%;background:var(${c})"></i>`:'').join('')}</span>`;}

function render(){
  const f=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.bind:null;
  R=compute(S.data,S.prev); FOLD_IDS=[];
  renderHeader();
  document.getElementById('nav').innerHTML=TABS.map(([k,l],i)=>`<button data-act="tab" data-val="${k}" class="${S.ui.tab===k?'on':''}"><i>${i+1}</i>${l}</button>`).join('')
    +`<span class="navtot"><span class="curname ${isDirty()?'dirty':''}" title="${isDirty()?'Modifiche non salvate':'Salvato'}">${esc(S.prev._id?S.prev._nome:'Nuovo preventivo')}${isBlank(S.prev)?'':isDirty()?' <i>● non salvato</i>':' <i class="ok">✓ salvato</i>'}</span>Totale <b>${eur(R.total)}</b></span>`;
  const fn={listino:vListino,distinte:vDistinte,config:vConfig,costi:vCosti,extra:vExtra,margini:vMargini,lavor:vLavor,mont:vMont,archivio:vArchivio}[S.ui.tab];
  document.getElementById('main').innerHTML=(R.warn.length?`<div class="warn">${R.warn.map(esc).join('<br>')}</div>`:'')+fn();
  // Il campo ridisegnato riprende il fuoco: dopo un Tab con il contenuto selezionato (si scrive sopra), dopo un clic con il cursore in fondo.
  if(f){const el=document.querySelector(`[data-bind="${CSS.escape(f)}"]`);
    if(el){el.focus();if(el.tagName==='INPUT'&&el.type!=='date'){if(tabFocus)el.select();else el.setSelectionRange(el.value.length,el.value.length);}}}
  tabFocus=false;
  applyFilter(); saveUi();
}
function renderHeader(){
  if(!R)R=compute(S.data,S.prev);
  const k=(l,v,c='')=>`<div class="kpi ${c}"><small>${l}</small><b>${v}</b></div>`;
  document.getElementById('kpis').innerHTML=
    k('Costo totale',eur(R.total),'main')+
    k('Prezzo di vendita',eur(R.prezzo))+
    k('Potenza',fN(R.kwp,2)+' kWp')+
    k('€/Wp',R.kwp?fN(R.total/(R.kwp*1000),4):'–');
}

    <th class="n">Mat. €/${u}</th><th class="n">Zinc. €/${u}</th><th class="n">Lavoraz. €/${u}</th><th class="n">Totale €/${u}</th><th></th></tr>`;

const TIPI={barra:'Profili a barra — prezzati al metro',pezzo:'Carpenteria e pezzi speciali — prezzati a pezzo',comm:'Componenti — prezzati a pezzo'};

    `<div class="toolbar"><label class="f">Maggiorazione peso zincatura (%)${inp('data.params.maggZinc',{type:'pct'})}</label></div>

          €/kg zincatura <input id="bulk-zn" inputmode="decimal"> <button class="btn s" data-act="bulk" data-val="zn" title="Solo sulle voci già zincate">Applica</button>

function applyFilter(){

function codeOpts(extra){return [...extra,...S.data.listino.map(x=>[x.c,`${x.c} — ${x.d}`])];}
const assiTxt=s=>s.assi.filter(a=>a.c==='$ASSE').map(a=>`${a.q}×${fL(a.L)} m`).join(' + ');
function vDistinte(){
  const sizes=S.data.sizes, keys=Object.keys(sizes).sort((a,b)=>a-b);

    let b=`<p class="hint">I numeri sono i <b>driver</b> delle quantità: MOT = pilastri motore, CUSC = pilastri cuscinetto, OMEGA = kit omega, PANN = kit pannello (= numero di moduli).</p>

    s.assi.forEach((a,j)=>{b+=`<tr><td style="width:340px">${sel(`data.sizes.${S.ui.sizeSel}.assi.${j}.c`,codeOpts([['$ASSE','$ASSE — asse scelto (3,0 / 2,5 mm)']]))}</td>
      <td>${inp(`data.sizes.${S.ui.sizeSel}.assi.${j}.d`,{type:'txt',ph:'(da listino)'})}</td><td style="width:100px">${inp(`data.sizes.${S.ui.sizeSel}.assi.${j}.L`,{type:'lexpr'})}</td>
      <td style="width:120px">${inp(`data.sizes.${S.ui.sizeSel}.assi.${j}.q`,{type:'txt',cls:'n'})}</td><td><button class="btn x" data-act="delAssi" data-val="${j}">✕</button></td></tr>`;});
    return b+`</table></div>`;}});
  const ph=[['$PROF','$PROF — profilo pilastri (IPE/IPEA)'],['$OMEGA','$OMEGA — omega scelto (2,0/1,8)'],['$ASSE','$ASSE — asse scelto']];
  for(const g of GROUPS.filter(g=>g!=='ASSI DI ROTAZIONE')){

    h+=fold('di-g-'+g,{title:g.charAt(0)+g.slice(1).toLowerCase(),sum:`${rows.length} righe · comuni a tutte le taglie`,
      act:`<button class="btn" data-act="addTpl" data-val="${g}">+ riga</button>`,body:()=>{
      let b=`<p class="hint">Quantità come formula dei driver (es. <code>CUSC*2</code>, <code>OMEGA*4+PANN*4</code>). "Basso" vuoto = come Agrivoltaico, <code>0</code> = assente nel basso.
        Lunghezze in metri oppure <code>$LFOND</code>, <code>$LCUSC</code>, <code>$LMOT</code>.</p>

      for(const j of rows){b+=`<tr><td style="width:300px">${sel(`data.template.${j}.c`,codeOpts(ph))}</td>

      return b+`</table></div>`;}});

/* ---------- 4 COSTI ---------- */

const costHead=()=>vCols().map(([,l])=>`<th class="n">${l} €</th>`).join('')+`<th class="n">Totale €</th><th class="n">%</th>`;
function vCosti(){

     <tr class="tot"><td>TOTALE</td><td></td><td class="n">${fN(T.peso,1)}</td>${costCells(T,total)}</tr></table></div>`});

function getTree(v){
  const V=VIEWS[v]; const root=buildTree(R.lines,V.levels);
  const sortK=m=>new Map([...m.entries()].sort((a,b)=>V.order(a[0])-V.order(b[0])));
  root.children=sortK(root.children); return root;
}
function treeRows(v,total){
  const root=getTree(v); let h='';
  const walk=(n,path,d)=>{
    const kids=[...n.children.values()]; const has=kids.length||(n.sd&&n.sd.length); const open=S.ui.open.has(path);
    h+=`<tr class="d${d} ${has?'click':''}" ${has?`data-act="tog" data-val="${esc(path)}"`:''}><td><span class="tg">${has?(open?'▾':'▸'):''}</span><span class="lbl">${esc(n.label)}</span>${n.sub?` <span class="code">${esc(n.sub)}</span>`:''}</td>
      <td class="n">${n.leaf?fQ(n.q):''}</td><td class="n">${n.peso?fN(n.peso,1):''}</td>${costCells(n,total)}</tr>`;
    if(!open)return;
    if(n.sd)for(const c of n.sd){const q=n.q*num(c.q),a=q*num(c.p);
      h+=`<tr class="sd"><td>↳ ${esc(c.d)} <span class="code">${esc(c.c)}</span></td><td class="n">${fQ(q)}</td><td></td><td colspan="3"></td><td class="n">${fN(a)}</td>${R.T.altro?'<td></td>':''}<td class="n">${fN(a)}</td><td class="n">${pct(a,total)}</td></tr>`;}
    kids.forEach(k=>walk(k,path+'/'+k.key,d+1));
  };
  for(const k of root.children.values())walk(k,v+'/'+k.key,0);
  return h;
}

function rigaCfg(r){return `${r.taglia} moduli · ${r.tipo} · ${r.prof} · asse ${r.asse} mm · omega ${r.omega} mm${r.tipo==='Basso'?'':' · fond. '+fL(r.lFond)+' m'} · cusc. ${fL(r.lCusc)} m · motore ${fL(num(r.lCusc)-0.08)} m`;}
function buildLavor(){
  const map=new Map(S.data.listino.map(x=>[x.c,x])), mz=num(S.data.params.maggZinc);
  const mk=l=>{const it=map.get(l.code)||{}, t=it.t||'comm', L=t==='barra'?num(l.L):'';
    const kgU=t==='barra'?L*num(it.kg):num(it.kg), zinc=t!=='comm'&&num(it.zn)>0;
    // kgT = peso nero totale; kgZ = peso dopo la zincatura (solo pezzi zincati, altrimenti 0)
    return {code:l.code,desc:String(l.desc).replace(/ · L [\d.,]+ m$/,''),dItem:it.d||l.desc,cat:l.cat,sub:l.sub,t,L,qPer:l.qPer,q:l.q,kgU,kgT:kgU*l.q,kgZ:zinc?kgU*l.q*(1+mz):0,zinc,cost:tot(l),sd:l.sd,riga:l.riga,gruppo:l.gruppo};};
  const items=R.lines.filter(l=>l.riga!=='extra').map(mk);
  const righe=S.prev.righe.map((r,i)=>{const its=items.filter(x=>x.riga===i), gruppi=[];
    for(const x of its){let G=gruppi.find(y=>y.nome===x.gruppo); if(!G)gruppi.push(G={nome:x.gruppo,items:[]}); G.items.push(x);}
    return {i,r,n:num(r.n),gruppi,kg:its.reduce((a,x)=>a+x.kgT,0),kgZ:its.reduce((a,x)=>a+x.kgZ,0)};}).filter(x=>x.n>0);
  const imp=items.filter(x=>x.riga==='imp');
  const tg=new Map();
  for(const x of items.filter(x=>x.t==='barra')){const k=x.code+'|'+x.L;
    let e=tg.get(k); if(!e)tg.set(k,e={code:x.code,desc:x.dItem,L:x.L,pz:0,kg:0,kgZ:0,zinc:x.zinc,righe:new Set()});
    e.pz+=x.q; e.kg+=x.kgT; e.kgZ+=x.kgZ; if(typeof x.riga==='number')e.righe.add('R'+(x.riga+1));}
  const taglio=[...tg.values()].sort((a,b)=>a.code.localeCompare(b.code)||b.L-a.L);
  const od=new Map();
  for(const x of items){let e=od.get(x.code);
    if(!e)od.set(x.code,e={cat:x.cat,sub:x.sub,code:x.code,desc:x.dItem,t:x.t,um:x.t==='barra'?'m':'pz',qty:0,kg:0,kgZ:0,zinc:x.zinc,cost:0,sd:x.sd});
    e.qty+=x.t==='barra'?x.q*x.L:x.q; e.kg+=x.kgT; e.kgZ+=x.kgZ; e.cost+=x.cost;}
  const ordini=[...CATS,'NON TROVATO'].map(c=>({cat:c,items:[...od.values()].filter(e=>e.cat===c).sort((a,b)=>(a.sub||'').localeCompare(b.sub||'')||a.code.localeCompare(b.code))})).filter(g=>g.items.length);
  const sum=k=>items.reduce((a,x)=>a+x[k],0);
  return {righe,imp,taglio,ordini,kg:sum('kgT'),kgZ:sum('kgZ'),cost:sum('cost'),mz};
}

/* ---------- Gantt di produzione ---------- */
// Date come numero di giorno (UTC, 0 = 01/01/1970): niente problemi di ora legale.
const DAY=864e5;
const dNum=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],m[2]-1,+m[3])/DAY:null;};
const dToday=()=>{const t=new Date();return Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY;};
const dDate=n=>new Date(n*DAY);
const dFmt=n=>dDate(n).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'});
const dow=n=>(n+4)%7;                       // 0 = domenica
const monday=n=>n-(dow(n)+6)%7;
function isoWeek(n){const t=monday(n)+3, y=dDate(t).getUTCFullYear();return 1+Math.floor((t-Date.UTC(y,0,1)/DAY)/7);}
// Festivita' nazionali italiane + lunedi' dell'Angelo (Pasqua con l'algoritmo di Gauss/Meeus).
const HOL={};
function holidays(y){if(HOL[y])return HOL[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;
  const s=new Set(['1-1','1-6','4-25','5-1','6-2','8-15','11-1','12-8','12-25','12-26'].map(x=>{const [M,D]=x.split('-');return Date.UTC(y,M-1,+D)/DAY;}));
  s.add(Date.UTC(y,mo-1,da)/DAY+1); return HOL[y]=s;}
const isWork=n=>{const w=dow(n);return w>0&&w<6&&!holidays(dDate(n).getUTCFullYear()).has(n);};
const nextWork=n=>{while(!isWork(n))n++;return n;};
const prevWork=n=>{while(!isWork(n))n--;return n;};
// Fine esclusiva: il giorno dopo l'ultimo giorno lavorativo occupato.
const addWork=(s,d)=>{let n=s;while(d>0){if(isWork(n))d--;n++;}return n;};
const nWorkDays=(a,b)=>{let k=0;for(let n=a;n<=b;n++)if(isWork(n))k++;return k;};

  assi:['Assi, omega, inclinometri e finecorsa','--acc','235E5A'],moduli:['Posa moduli FV','--c-acq','5F9473'],

  extra:['Fase aggiunta','--ink2','3B4852']};

  ['ggZinc','Zincatura: giorni minimi del giro'],['kgZinc','Zincatura: capacità (kg/giorno)'],['kgCamion','Portata camion (kg)'],['camionGg','Camion caricati al giorno'],

function gPar(){const p=S.data.params;if(!p.gantt)p.gantt=clone(GANTT0);for(const k in GANTT0)if(p.gantt[k]==null)p.gantt[k]=GANTT0[k];return p.gantt;}
function gPrev(){const P=S.prev;if(!P.gantt)P.gantt=defGantt();const g=P.gantt;g.dur=g.dur||{};g.da=g.da||{};return g;}
// Valori calcolati dei campi facoltativi, per percorso del campo: segnaposto in grigio e punto di partenza delle frecce.
let AUTO={};
const divUp=(a,b)=>a>0&&num(b)>0?Math.ceil(a/num(b)):0;
const commName=()=>[S.prev.cliente,S.prev.rif].filter(Boolean).join(' · ')||'Preventivo';
const ganttT0=()=>{const pg=gPrev();return dNum(pg.inizio)??dNum(S.prev.data)??dToday();};
const isoDay=n=>dDate(n).toISOString().slice(0,10);
// Pianificatore comune: una fase parte dopo le fasi da cui dipende e non prima dell'avvio (calcolo automatico).
// ov = {dur, da} con le modifiche a mano del preventivo: da = inizio fissato dall'utente: libero, le fasi si possono sovrapporre.
// autoDa = data "non prima del" proposta (es. consegna dalla produzione).
// ov.hid = fasi tolte dal Gantt: non si vedono e chi dipendeva da loro eredita le loro dipendenze.
// ov.extra = fasi aggiunte dall'utente [{id,name,grp}]: senza vincoli, date e durata come le altre.
function scheduler(t0,ov,pfx){
  const tasks=[], by={}, groups=[], hidden=[]; ov.hid=ov.hid||{}; ov.extra=ov.extra||[];
  const add=(id,fase,grp,base,auto,deps,name,autoDa)=>{
    if(ov.hid[id]){let s=t0; const dd=[]; for(const d of deps)if(by[d]){s=Math.max(s,by[d].f); dd.push(...(by[d].hid?by[d].deps:[d]));}
      const t=by[id]={id,name:name||FASI[fase][0],hid:true,f:s,deps:[...new Set(dd)]}; hidden.push(t); return t;}
    const o=ov.dur[id], man=o!==''&&o!=null, dur=man?Math.max(0,Math.round(num(o))):auto;
    let s=t0; for(const d of deps)if(by[d])s=Math.max(s,by[d].f);
    const ad=dNum(autoDa); if(ad!=null)s=Math.max(s,ad);
    const ready=nextWork(s), daMan=dNum(ov.da[id])!=null?ov.da[id]:'';
    s=daMan?nextWork(dNum(daMan)):ready; const f=addWork(s,dur);
    const t={id,fase,grp,name:name||FASI[fase][0],base,auto,dur,ov:man,s,f,last:dur?prevWork(f-1):s,forced:daMan||autoDa||'',autoDa:autoDa||'',daMan,
      ready,deps:[...new Set(deps.filter(d=>by[d]).flatMap(d=>by[d].hid?by[d].deps:[d]))]};
    AUTO[pfx+id]=auto; tasks.push(by[id]=t); return t;};
  const done=()=>{
    ov.extra.forEach((e,i)=>{if(!groups.some(g=>g.key===e.grp)){e.grp='extra'; if(!groups.some(g=>g.key==='extra'))groups.push({key:'extra',label:'Fasi aggiunte'});}
      add(e.id,'extra',e.grp,'aggiunta a mano',5,[],e.name||'Nuova fase').xi=i;});
    const start=nextWork(t0), act=tasks.filter(t=>t.dur);
    const end=act.length?Math.max(...act.map(t=>t.last)):start;
    // Finestra del grafico: da lunedi' a domenica, cosi' la griglia settimanale torna sempre.
    const a=monday(Math.min(t0,...tasks.map(t=>t.s))), b=monday(Math.max(end,...tasks.map(t=>t.s)))+6;
    return {tasks,groups,hidden,t0,start,end,nWork:nWorkDays(start,end),view:{a,nd:b-a+1}};};
  return {add,groups,done};
}
// Fasi per riga tracker: l'officina lavora una riga alla volta; zincatura (esterna) e spedizioni possono sovrapporsi.
// Il montaggio in campo non fa parte del Gantt di produzione: ha il suo Gantt nella scheda Montaggio.
function buildGantt(D){
  const g=gPar(), K=scheduler(ganttT0(),gPrev(),'prev.gantt.dur.'), {add,groups}=K, div=divUp;
  const all=[...D.righe.flatMap(r=>r.gruppi.flatMap(G=>G.items)),...D.imp];
  const kgAcc=all.filter(x=>x.t!=='comm').reduce((a,x)=>a+x.kgT,0), nComm=new Set(all.filter(x=>x.t==='comm').map(x=>x.code)).size;
  groups.push({key:'app',label:'Approvvigionamento · intera commessa'});
  add('acc','acc','app',`${fN(kgAcc/1000,2)} t di acciaio`,kgAcc>0?Math.round(num(g.ltAcc)):0,[]);
  add('comm','comm','app',`${nComm} codici commerciali`,nComm?Math.round(num(g.ltComm)):0,[]);
  let prevLav=null;
  for(const R1 of D.righe){const k='r'+R1.i, its=R1.gruppi.flatMap(G=>G.items);
    groups.push({key:k,label:`R${R1.i+1} · ${fN(R1.n,0)} tracker · ${R1.r.taglia} moduli · ${R1.r.tipo}`});
    const kS=its.filter(x=>x.t!=='comm').reduce((a,x)=>a+x.kgT,0), kZ=R1.kgZ, kSp=its.reduce((a,x)=>a+(x.kgZ||x.kgT),0);
    const viaggi=div(kSp,g.kgCamion);
    const lav=add('lav-'+R1.i,'lav',k,`${fN(kS,0)} kg di acciaio`,div(kS,g.kgLav),['acc',prevLav]);
    add('zinc-'+R1.i,'zinc',k,kZ?`${fN(kZ,0)} kg zincati`:'nessun pezzo da zincare',kZ?Math.max(Math.round(num(g.ggZinc)),div(kZ,g.kgZinc)):0,[lav.id]);
    add('sped-'+R1.i,'sped',k,`${viaggi} camion · ${fN(kSp/1000,1)} t`,viaggi?div(viaggi,g.camionGg)+Math.round(num(g.ggTrans)):0,['zinc-'+R1.i,'comm']);
    prevLav=lav.id;}
  if(D.imp.length){groups.push({key:'imp',label:'Impianto · quadri e centralina meteo'});
    add('imp-sped','sped','imp',`${D.imp.length} componenti`,Math.max(1,Math.round(num(g.ggTrans))),['comm'],'Spedizione componenti impianto');}
  return K.done();
}
// Tendina con il Gantt. o = {id, step, title, pd (percorso delle modifiche: 'prev.gantt' | 'prev.mont'), endLabel, hint, printAct, par:{id,title,sum,keys,base}}
function ganttFold(G,o){
  if(!G.tasks.length&&!G.hidden.length)return '';
  const P=S.prev, pg=gPrev(), ov=getP(o.pd), today=dToday();
  const {a,nd}=G.view, pos=n=>(n-a)/nd*100, cc=t=>`--cc:var(${FASI[t.fase][1]})`;
  const tl=inner=>`<td class="tl" data-nd="${nd}">${today>=a&&today<a+nd?`<i class="gtoday" style="left:${pos(today)}%"></i>`:''}${inner}</td>`;
  // Barre trascinabili: al centro spostano l'inizio, il bordo destro cambia la durata.
  const drag=t=>`data-pd="${o.pd}" data-id="${t.id}" data-s="${t.s}" data-last="${t.last}"`;
  const bar=t=>t.dur?`<i class="gb" ${drag(t)} style="left:${pos(t.s)}%;width:${(t.last+1-t.s)/nd*100}%;${cc(t)}" title="${esc(t.name)}: ${dFmt(t.s)} → ${dFmt(t.last)} · ${t.dur} gg&#10;Trascina per spostare, dal bordo destro per allungare"><b class="gh"></b></i>`
    :`<i class="gm" ${drag(t)} style="left:${pos(t.s)}%;${cc(t)}" title="${esc(t.name)}: ${dFmt(t.s)}&#10;Trascina per spostare"></i>`;
  // Campo data per Inizio / Fine: mostra il calcolato; in oro se scritto a mano.
  const dIn=(x,k,n,man,tip)=>`<span class="noprint"><input type="date" class="${man?'ovr':''}" data-gd="${k}" data-pd="${o.pd}" data-id="${x.id}" data-s="${x.s}" value="${isoDay(n)}" title="${tip}"></span><span class="onlyprint">${dFmt(n)}</span>`;
  // Intestazione: mesi sopra, settimane (lunedi') sotto.
  let mh='', wh='';
  for(let n=a;n<a+nd;){const d=dDate(n), nx=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)/DAY, e=Math.min(nx,a+nd);
    mh+=`<span style="left:${pos(n)}%;width:${(e-n)/nd*100}%">${d.toLocaleDateString('it-IT',{month:'short',year:'numeric',timeZone:'UTC'})}</span>`; n=e;}
  const nw=nd/7, ws=Math.ceil(nw/26);
  for(let w=0;w<nw;w+=ws){const n=a+w*7;wh+=`<span style="left:${pos(n)}%;width:${ws/nw*100}%" title="Settimana ${isoWeek(n)}">${dFmt(n).slice(0,5)}</span>`;}
  let t=`<div class="wrap"><table class="gt" style="--nw:${nw}"><tr><th>Fase</th><th>Base di calcolo</th><th class="n">Durata gg</th><th class="n">Inizio</th><th class="n">Fine</th><th class="np"></th><th class="tl"><div class="tlh"><div>${mh}</div><div>${wh}</div></div></th></tr>`;
  for(const gr of G.groups){const ts=G.tasks.filter(x=>x.grp===gr.key), on=ts.filter(x=>x.dur); if(!ts.length)continue;
    const gs=on.length?Math.min(...on.map(x=>x.s)):null, ge=on.length?Math.max(...on.map(x=>x.last)):null;
    t+=`<tr class="g1"><td colspan="5">${esc(gr.label)}</td><td class="np"></td>${tl(gs!=null?`<i class="gs" style="left:${pos(gs)}%;width:${(ge+1-gs)/nd*100}%"></i>`:'')}</tr>`;
    for(const x of ts)t+=`<tr><td class="${x.xi!=null?'gname':''}"><span class="dot" style="${cc(x)}"></span>${x.xi!=null?`<span class="noprint">${inp(`${o.pd}.extra.${x.xi}.name`,{type:'txt',ph:'Nome della fase'})}</span><span class="onlyprint">${esc(x.name)}</span>`:esc(x.name)}</td><td class="muted small">${esc(x.base)}</td>
      <td class="dur"><span class="noprint">${inp(`${o.pd}.dur.${x.id}`,{type:'optnum',ph:String(x.auto),cls:x.ov?'ovr':''})}</span><span class="onlyprint">${x.dur}</span></td>
      <td class="n dt">${dIn(x,'s',x.s,!!x.daMan,x.daMan?`Inizio fissato a mano. Calcolato: ${dFmt(x.ready)}`:'Calcolato in automatico: scegli una data per fissarlo')}</td>
      <td class="n dt">${x.dur||x.auto?dIn(x,'f',x.last,x.ov,x.ov?`Durata scritta a mano: ${x.dur} gg (calcolata ${x.auto} gg)`:'Calcolata in automatico: scegli una data per cambiare la durata'):'–'}</td>
      <td class="np">${x.daMan||x.ov?`<button class="btn s" data-act="gRow" data-val="${o.pd}|${x.id}" title="Torna alle date calcolate">↺</button>`:''}<button class="btn s x" data-act="gHide" data-val="${o.pd}|${x.id}" title="${x.xi!=null?'Elimina la fase':'Togli dal Gantt (si può rimettere)'}">✕</button></td>${tl(bar(x))}</tr>`;}
  t+=`<tr class="end"><td colspan="2">${o.endLabel}</td><td class="n">${G.nWork}</td><td class="n">${dFmt(G.start)}</td><td class="n">${dFmt(G.end)}</td><td class="np"></td>${tl(`<i class="gm" style="left:${pos(G.end+1)}%;--cc:var(--ink)"></i>`)}</tr></table></div>`;
  const nOv=Object.values(ov.dur).filter(v=>v!==''&&v!=null).length+Object.values(ov.da).filter(Boolean).length;
  const legend=`<div class="glegend">${[...new Set(G.tasks.map(x=>x.fase))].map(k=>`<span><i style="background:var(${FASI[k][1]})"></i>${FASI[k][0]}</span>`).join('')}<span><i class="lt"></i>Oggi</span></div>`;
  return fold(o.id,{step:o.step,title:o.title,cls:'pcard',
    sum:`Avvio ${dFmt(G.start)} · fine ${dFmt(G.end)} · ${G.nWork} giorni lavorativi${nOv?` · ${nOv} modific${nOv===1?'a':'he'} a mano`:''}`,
    act:`<label class="small muted">Avvio commessa</label><input type="date" data-bind="prev.gantt.inizio" data-type="txt" value="${esc(pg.inizio||P.data)}">${o.printAct?`<button class="btn" data-act="${o.printAct}">Stampa / PDF</button>`:''}`,
    body:()=>`<div class="onlyprint gtitle"><b>${o.title}</b> · ${esc(commName())} · avvio ${dFmt(G.start)} · fine ${dFmt(G.end)} · ${G.nWork} giorni lavorativi · emesso il ${dFmt(today)}</div>
      <p class="hint noprint">${o.hint}</p>${legend}${t}
      <div class="noprint"><div class="toolbar"><span class="muted">Aggiungi una fase in</span><select id="gx-${o.id}">${G.groups.map(g=>`<option value="${g.key}">${esc(g.label)}</option>`).join('')}${G.groups.some(g=>g.key==='extra')?'':'<option value="extra">Fasi aggiunte</option>'}</select>
        <button class="btn" data-act="gAdd" data-val="${o.pd}|gx-${o.id}">+ Aggiungi fase</button></div>
      ${G.hidden.length?`<div class="toolbar"><span class="muted">Fasi tolte (non competono):</span>${G.hidden.map(x=>`<button class="btn s" data-act="gShow" data-val="${o.pd}|${x.id}" title="Rimetti nel Gantt">↺ ${esc(x.name)}</button>`).join('')}</div>`:''}
      ${nOv?`<div class="toolbar"><span class="muted">${nOv} modific${nOv===1?'a':'he'} a mano su durate o date.</span><button class="btn s" data-act="gReset" data-val="${o.pd}">Ripristina tutto calcolato</button></div>`:''}
      ${subfold(o.par.id,o.par.title,o.par.sum,()=>`<div class="grid">${o.par.keys.map(([k,l])=>`<label class="f">${l}${inp(o.par.base+'.'+k,{type:'optnum',ph:'–'})}</label>`).join('')}</div>`)}</div>`});
}

function archSave(asNew){

  save(); render();});
document.addEventListener('change',e=>{if(!e.target.dataset.bind)return;onEdit(e.target);if(ptr&&e.target.tagName==='INPUT')pend=true;else if(e.target.tagName==='INPUT'){tabFocus=true;setTimeout(render,0);}else render();});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();archSave(false);render();return;}if(e.key==='Enter'&&e.target.dataset.bind&&e.target.tagName==='INPUT'){e.target.blur();}
  if((e.key==='ArrowUp'||e.key==='ArrowDown')&&e.target.dataset.step){e.preventDefault();const d=e.target.dataset;bump(d.bind,d.type,+d.step,(e.key==='ArrowUp'?1:-1)*(e.shiftKey?10:1));render();}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, v=b.dataset.val, D=S.data, P=S.prev, F=S.ui.folds;
  if(a==='fold'&&e.target.closest('input,select,textarea,.fact'))return;
  switch(a){
    case 'fold': F[v]=!isOpen(v); break;
    case 'foldAll': {const on=v==='1'; for(let k=0;k<3;k++){FOLD_IDS.forEach(id=>F[id]=on); render();} if(!on)S.ui.open=new Set(); break;}
    case 'tab': S.ui.tab=v; window.scrollTo(0,0); break;
    case 'set': {const m=b.dataset.path.match(/^prev\.righe\.(\d+)\.tipo$/);
      if(m){const r=P.righe[+m[1]];if(Math.abs(num(r.lCusc)-MIN_CUSC[r.tipo])<1e-9)r.lCusc=MIN_CUSC[b.dataset.val];}}
      setP(b.dataset.path,b.dataset.val); {const m=b.dataset.path.match(/^prev\.righe\.(\d+)/); if(m)fixRiga(P.righe[+m[1]]);} save(); break;
    case 'addRiga': P.righe.push(defRiga()); F['cf-trk']=true; save(); break;
    case 'dupRiga': P.righe.splice(+v+1,0,clone(P.righe[+v])); save(); break;
    case 'delRiga': if(P.righe.length>1||confirm('Eliminare l\'ultima riga tracker?'))P.righe.splice(+v,1); save(); break;
    case 'addItem': {const t=document.getElementById('newT-'+v).value;
      D.listino.push({c:'NUOVO-'+(Date.now()%100000),d:'Nuova voce',cat:v,sub:t==='barra'?'Profili a barra':t==='pezzo'?'Carpenteria':'Componenti',t,kg:0,acq:0,zn:0,lav:0.3,costo:0,u:true});
      S.ui.filter=''; F['li-'+v]=true; F[`li-${v}-${t}`]=true; save(); break;}
    case 'delItem': {const it=D.listino[+v];
      const used=D.template.some(t=>t.c===it.c)||Object.values(D.sizes).some(s=>s.assi.some(x=>x.c===it.c))||IMP.some(x=>x[1]===it.c);
      if(!confirm(`Eliminare "${it.c} — ${it.d}"?`+(used?'\n\nATTENZIONE: il codice è usato nelle distinte.':'')))return;
      D.listino.splice(+v,1); S.ui.openSd.clear(); save(); break;}
    case 'toggleSd': {const i=+v,it=D.listino[i]; if(!it.sd||!it.sd.length){it.sd=[{c:'',d:'Componente',q:1,p:num(it.costo)}];S.ui.openSd.add(i);} else S.ui.openSd.has(i)?S.ui.openSd.delete(i):S.ui.openSd.add(i); save(); break;}
    case 'addSd': D.listino[+v].sd.push({c:'',d:'',q:1,p:0}); save(); break;
    case 'delSd': {const [i,j]=v.split('.').map(Number); const it=D.listino[i]; it.sd.splice(j,1); if(!it.sd.length){delete it.sd;S.ui.openSd.delete(i);} save(); break;}
    case 'bulk': {const x=document.getElementById('bulk-'+v).value; if(x.trim()==='')return; const val=num(x);
      const its=D.listino.filter(it=>it.cat==='STRUTTURA'&&it.t!=='comm'&&(v!=='zn'||num(it.zn)>0));
      if(!confirm(`Impostare ${val} €/kg (${{acq:'acquisto',zn:'zincatura',lav:'lavorazione'}[v]}) su ${its.length} voci di Struttura?`))return;
      its.forEach(it=>it[v]=val); save(); break;}
    case 'resetData': if(!confirm('Ripristinare listino e distinte ai valori dell\'Excel? Le modifiche al listino andranno perse.'))return; S.data=defaultData(); save(); break;
    case 'resetDistinte': if(!confirm('Ripristinare le distinte ai valori dell\'Excel?'))return; D.template=clone(TEMPLATE0); D.sizes=clone(SIZES0); save(); break;
    case 'sizeSel': S.ui.sizeSel=v; F['di-assi']=true; break;
    case 'addAssi': D.sizes[S.ui.sizeSel].assi.push({c:'$ASSE',d:'Asse',L:6,q:'2'}); save(); break;
    case 'delAssi': D.sizes[S.ui.sizeSel].assi.splice(+v,1); save(); break;
    case 'addTpl': {let at=-1; D.template.forEach((t,j)=>{if(t.g===v)at=j;}); D.template.splice(at+1,0,{g:v||GROUPS[0],c:D.listino[0].c,d:'',L:'',qa:'MOT*1',qb:''}); save(); break;}
    case 'delTpl': D.template.splice(+v,1); save(); break;
    case 'addExtra': F['ex']=true; P.extra.push({desc:v,voce:'altro',modo:v==='Montaggio'?'tracker':'corpo',val:0}); save(); break;
    case 'delExtra': P.extra.splice(+v,1); save(); break;
    case 'tog': S.ui.open.has(v)?S.ui.open.delete(v):S.ui.open.add(v); break;
    case 'expandAll': {const walk=(n,p)=>{if(n.children.size||n.sd)S.ui.open.add(p);n.children.forEach(k=>walk(k,p+'/'+k.key));};
      getTree(S.ui.view).children.forEach(k=>walk(k,S.ui.view+'/'+k.key)); break;}
    case 'collapseAll': S.ui.open=new Set(); break;
    case 'newPrev': if(isDirty()&&!confirm('Il preventivo attuale ha modifiche non salvate. Iniziare comunque un nuovo preventivo?'))return; S.prev=newPrev(); S.ui.tab='config'; save(); break;
    case 'draftOpen': {const dr=load(KEY_DRAFT); if(!dr)break; if(isDirty()&&!confirm('Il preventivo attuale ha modifiche non salvate che andranno perse. Continuare?'))return;
      S.prev=normPrev(dr); try{localStorage.removeItem(KEY_DRAFT);}catch(e){} S.ui.tab='config'; save(); break;}
    case 'draftDel': if(!confirm('Scartare definitivamente la bozza non salvata?'))return; try{localStorage.removeItem(KEY_DRAFT);}catch(e){} break;
    case 'xlsLavor': downloadLavorXlsx(); return;
    case 'gHide': {const [pd,id]=v.split('|'), g=getP(pd), i=(g.extra||[]).findIndex(e=>e.id===id);
      if(i>=0){if(!confirm(`Eliminare la fase "${g.extra[i].name||'Nuova fase'}"?`))return; g.extra.splice(i,1);} else (g.hid=g.hid||{})[id]=true;
      delete g.dur[id]; delete g.da[id]; save(); break;}
    case 'gShow': {const [pd,id]=v.split('|'); delete getP(pd).hid[id]; save(); break;}
    case 'gAdd': {const [pd,sel]=v.split('|'), g=getP(pd); (g.extra=g.extra||[]).push({id:'x'+Date.now().toString(36),name:'',grp:document.getElementById(sel).value}); save(); break;}
    case 'gRow': {const [pd,id]=v.split('|'), g=getP(pd); delete g.dur[id]; delete g.da[id]; save(); break;}
    case 'gReset': if(!confirm('Cancellare le durate e le date scritte a mano e tornare ai valori calcolati?'))return; {const g=getP(v); g.dur={}; g.da={};} save(); break;
    case 'addMont': {const M=gMont(); let g=document.getElementById('newMG').value;
      if(!g){g=prompt('Nome del nuovo gruppo:','ALTRO'); if(!g||!g.trim())return; g=g.trim().toUpperCase();}
      let at=M.voci.length-1; M.voci.forEach((x,j)=>{if(x.g===g)at=j;});
      M.voci.splice(at+1,0,{id:'u'+Date.now().toString(36),g,c:'',d:'Nuova voce',um:'n',q:'',pf:'',pp:''}); F['mo-list']=true; save(); break;}
    case 'delMont': {const M=gMont(), x=M.voci[+v]; if(!confirm(`Eliminare la voce "${x.c} ${x.d}" dal listino montaggio?`))return; M.voci.splice(+v,1); save(); break;}
    case 'resetMont': if(!confirm('Ripristinare il listino montaggio predefinito? Prezzi, parametri del cantiere e voci aggiunte andranno persi.'))return; S.data.mont=defMont(); save(); break;
    case 'xlsMont': downloadMontXlsx(); return;
    // Stampa solo il Gantt, A4 orizzontale; tutto torna com'era dopo la stampa.
    case 'printGantt': printPage(['dl-gantt']); return;
    case 'printMont': printPage(['mo-comp','mo-gantt']); return;
    case 'printMontGantt': printPage(['mo-gantt']); return;
    case 'archSave': archSave(false); break;
    case 'archSaveNew': archSave(true); break;
    case 'archOpen': archOpen(v); break;
    case 'archDup': archDup(v); break;
    case 'archDel': archDel(v); break;
    case 'archDl': {const e=S.arch.find(a=>a.id===v); if(e)download(`preventivo_${fileName(e.nome)}.json`,JSON.stringify(archFile(e),null,1),'application/json'); return;}
    case 'archExp': download(`archivio_preventivi_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({tipo:'archivio',preventivi:S.arch}),'application/json'); return;
    case 'archImp': pickFile('arch'); return;
    case 'savePrev': download(`preventivo_${(P.rif||P.cliente||'tracker').replace(/[^\w-]+/g,'_')}_${P.data}.json`,JSON.stringify({tipo:'preventivo',prev:P,data:D},null,1),'application/json'); return;
    case 'openPrev': pickFile('prev'); return;
    case 'expData': download('listino_distinte_tracker.json',JSON.stringify({tipo:'dati',data:D},null,1),'application/json'); return;
    case 'impData': pickFile('data'); return;
    case 'expCSV': exportCSV(); return;
    case 'expListinoCSV': exportListinoCSV(); return;
    case 'print': S.ui.tab='costi'; F['co-riep']=true; F['co-cat']=true; render(); setTimeout(()=>window.print(),50); return;
  }
  render();
});
// Stampa solo le tendine indicate (classe pcard), A4 orizzontale; tutto torna com'era dopo la stampa.
function printPage(ids){
  ids.forEach(id=>S.ui.folds[id]=true); render(); document.body.classList.add('pg');
  ids.forEach(id=>document.querySelector(`[data-fold="${id}"]`)?.classList.add('pon'));
  const ps=document.createElement('style'); ps.textContent='@page{size:A4 landscape;margin:10mm}'; document.head.appendChild(ps);
  window.addEventListener('afterprint',()=>{document.body.classList.remove('pg');ps.remove();},{once:true});
  setTimeout(()=>window.print(),50);
}
let pickMode='';
function pickFile(m){pickMode=m;const f=document.getElementById('file');f.value='';f.click();}
document.getElementById('file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(pickMode==='arch'){archImport(j);render();return;}
    if(pickMode==='prev'){
      if(!j.prev)throw new Error('il file non contiene un preventivo');
      S.prev=normPrev(j.prev);
      if(j.data&&confirm('Il file contiene anche il listino usato per quel preventivo.\nOK = usa quel listino · Annulla = tieni il listino attuale'))S.data=j.data;
    } else {
      if(!j.data||!j.data.listino)throw new Error('il file non contiene un listino');
      if(!confirm('Sostituire listino e distinte con quelli del file?'))return;
      S.data=j.data;
    }
    save(); render();
  }catch(err){alert('File non valido: '+err.message);}
});
function csvRow(a){return a.map(x=>typeof x==='number'?String(Math.round(x*10000)/10000).replace('.',','):`"${String(x??'').replace(/"/g,'""')}"`).join(';');}
function exportCSV(){
  const rows=[['Riga','Gruppo','Categoria','Sottogruppo','Codice','Descrizione','Lunghezza m','Q.tà','Peso kg','Materiale','Zincatura','Lavorazione','Acquisto','Altro','Totale']];
  for(const l of R.lines)rows.push([l.rigaLabel,l.gruppo,l.cat,l.sub,l.code,l.desc,l.L,l.q,l.peso,l.mat,l.zinc,l.lav,l.acq,l.altro,tot(l)]);
  rows.push(['TOTALE','','','','','','','',R.T.peso,R.T.mat,R.T.zinc,R.T.lav,R.T.acq,R.T.altro,R.total]);
  download(`distinta_costi_${(S.prev.rif||'preventivo').replace(/[^\w-]+/g,'_')}.csv`,'﻿'+rows.map(csvRow).join('\r\n'),'text/csv');
}
function exportListinoCSV(){
  const rows=[['Categoria','Sottogruppo','Tipo','Codice','Descrizione','kg/m o kg/pz','€/kg acquisto','€/kg zincatura','€/kg lavorazione','Costo €/pz']];
  for(const it of S.data.listino)rows.push([it.cat,it.sub,it.t,it.c,it.d,num(it.kg),it.t==='comm'?'':num(it.acq),it.t==='comm'?'':num(it.zn),it.t==='comm'?'':num(it.lav),it.t==='comm'?unitCost(it):'']);
  download('listino_tracker.csv','﻿'+rows.map(csvRow).join('\r\n'),'text/csv');
}

if(typeof window!=='undefined'&&!window.__TEST__){
  const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h))S.ui.tab=h;
  render();
}
</script>
